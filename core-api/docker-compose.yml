services:
  postgres:
    image: postgres:16
    container_name: cafepos-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cafepos
    ports:
      # 5434 en el host: 5432 lo ocupa un PostgreSQL nativo de Windows en
      # esta máquina, y 5433 ya lo usa otro contenedor (ipm_bi_db).
      - "5436:5432"
    volumes:
      - cafepos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cafepos_pgdata:
