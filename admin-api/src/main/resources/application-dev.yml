spring:
  datasource:
    # Misma base que core-api (ver docker-compose.yml de cafepos-core-api,
    # puerto 5434), pero rol app_platform: BYPASSRLS, exclusivo de admin-api.
    # NUNCA usar app_tenant aca (ver CLAUDE.md).
    url: jdbc:postgresql://localhost:5434/cafepos
    username: app_platform
    password: dev_only_password_platform

logging:
  level:
    com.cafepos.admin: DEBUG

cafepos:
  admin:
    jwt:
      signing-key: dev-only-admin-signing-key-nunca-usar-en-produccion-cambiar-por-variable-de-entorno
  factus:
    # MISMO valor, copiado tal cual, que cafepos.factus.encryption-key en
    # core-api/src/main/resources/application-dev.yml — CRITICO que
    # coincida (ver shared.criptografia.FactusCredencialesCryptoService):
    # admin-api cifra, core-api descifra, con la misma llave.
    encryption-key: MvywKIMVe+RWrI7GSnt+1aSf9znpzXRFIPxmeQ+psQU=

# Swagger UI / OpenAPI — habilitado SOLO en dev (ver application.yml, donde
# queda deshabilitado por defecto).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
