spring:
  application:
    name: admin-api

  # Mismo casing que core-api (ver su application.yml) — todo JSON de
  # request/response usa snake_case, los campos Java se quedan en camelCase
  # normal, Jackson convierte solo. Sin esto, este servicio respondia en
  # camelCase (accessToken, tenantId) mientras core-api siempre respondio
  # en snake_case (access_token, tenant_id) — inconsistencia real para
  # cualquier cliente que hable con los dos servicios.
  jackson:
    property-naming-strategy: SNAKE_CASE

  # No Flyway en este proyecto: el schema ya existe (lo crea y versiona
  # core-api). ddl-auto=validate confirma que la entidad Superadmin y
  # SuperadminRefreshToken coinciden con las tablas reales, nunca las crea.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Swagger UI / OpenAPI — deshabilitado por defecto en TODO ambiente.
# Solo application-dev.yml lo pone en true, mismo patron que core-api.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Configuracion propia de admin-api. Llave de firma y issuer/audience
# separados de core-api a proposito: sin sesion compartida entre los dos
# servicios (ver CLAUDE.md).
cafepos:
  admin:
    jwt:
      signing-key: ${CAFEPOS_ADMIN_JWT_SIGNING_KEY}
      issuer: cafepos-admin-api
      audience: cafepos-admin-api
      access-token-ttl-minutes: 10
    refresh-token:
      ttl-days: 7
  factus:
    # MISMA property name y MISMA variable de entorno que core-api (ver su
    # application.yml) — en cualquier ambiente real, CAFEPOS_FACTUS_ENCRYPTION_KEY
    # debe apuntar al mismo valor en los dos servicios, o core-api nunca va
    # a poder descifrar lo que admin-api cifro.
    encryption-key: ${CAFEPOS_FACTUS_ENCRYPTION_KEY}
  tenant:
    # Dominio publico bajo el que se sirve cada negocio (POST /admin/negocios
    # arma la url de vuelta con este valor: https://{slug}.{base-domain}).
    base-domain: resttodash.app
