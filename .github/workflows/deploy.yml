name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Si llegan 2 pushes seguidos, el segundo deploy ESPERA a que termine el
# primero en vez de correr los dos al mismo tiempo — dos builds de Java sin
# cache a la vez saturaron el VPS (memoria al 108%, hasta la consola del
# droplet dejo de responder) el 24-ago-2026. cancel-in-progress: false a
# proposito: si cancelara el que esta corriendo, podria cortar un
# `docker compose build` a la mitad, mejor dejarlo terminar y encolar el
# siguiente.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Default de la action es 10m — con --no-cache (ver abajo por que
          # se saco) esto ya se quedo corto una vez (25-ago-2026, build de
          # Compras cortado a mitad de camino). Con cache deberia sobrar de
          # sobra. Subido a 30m (antes 20m) para dejar margen real al lock
          # de abajo: hasta 20 min esperando que el otro repo termine, mas
          # el build en si.
          command_timeout: 30m
          script: |
            set -e
            # Lock compartido con el deploy del frontend (mismo archivo,
            # mismo path, en los dos repos) — un push casi simultaneo a
            # ambos saturaba el VPS de 1 vCPU/1GB corriendo dos builds de
            # Docker en paralelo (INTEGRACION.md 2.14). flock serializa: el
            # segundo deploy que llega espera a que el primero termine y
            # suelte el lock, en vez de correr a la vez. No cancela nada
            # (mismo espiritu que cancel-in-progress: false de arriba, pero
            # cruzando repos, que concurrency de Actions no cubre).
            (
              flock -w 1200 200 || { echo "Timeout esperando el lock de deploy (el otro repo no termino a tiempo)"; exit 1; }
              cd ~/resttodash/backend
              git fetch
              git checkout main
              git pull
              cd ~/resttodash
              # Sin --no-cache a proposito: la descarga de dependencias
              # (./mvnw dependency:go-offline, ~4-5 min por servicio sin
              # cache) es identica entre deploys mientras no cambien
              # mvnw/pom.xml — Docker la reusa sola. --no-cache forzaba
              # recompilar TODO desde cero en cada deploy, que fue justo lo
              # que hizo que un deploy se quedara sin tiempo (25-ago-2026,
              # ver INTEGRACION.md 2.14). Docker sigue invalidando la cache
              # sola cuando el codigo fuente realmente cambia (COPY src src).
              docker compose build core-api admin-api
              docker compose up -d core-api admin-api
              # core-api/admin-api quedan con IP nueva en la red de Docker al
              # recrearse — nginx no siempre la recoge solo (visto en vivo:
              # 502 sostenido con el contenedor nuevo ya sano, hasta hacer
              # este reload a mano). El resolver con TTL corto no alcanza a
              # cubrir esto de forma confiable, asi que se fuerza siempre.
              docker exec resttodash-nginx nginx -s reload
            ) 200>~/resttodash/.deploy.lock